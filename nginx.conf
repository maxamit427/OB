# Nginx configuration for Older Brother Team SPA + Express API
# Place this inside your server {} block or use as a reference.
#
# If you deploy the full Node.js stack (Express backend):
#   - proxy_pass all traffic to Node on port 5000
#   - Node's catch-all serves index.html for unknown routes
#
# If you deploy ONLY the static dist/public/ folder (no Node):
#   - Use the try_files SPA fallback below

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # ── Option A: Full-stack Node (recommended) ──────────────────────────────
    # Proxy everything to the Express server
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # ── Option B: Static-only (no Node, no API) ──────────────────────────────
    # Uncomment this block and comment out Option A if you serve dist/public/
    # directly from Nginx without a backend process.
    #
    # root /var/www/html/dist/public;
    # index index.html;
    #
    # location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|mp3)$ {
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    # }
    #
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
