    <script>
      // SPA redirect handler for static hosts (GitHub Pages, cPanel, shared hosting).
      // The 404.html page stores the intended path in sessionStorage and redirects
      // to the root. This snippet restores the URL so the router picks it up.
      (function () {
        var redirect = sessionStorage.getItem('spa_redirect');
        if (redirect) {
          sessionStorage.removeItem('spa_redirect');
          window.history.replaceState(null, '', redirect);
        }
      })();
    </script>
